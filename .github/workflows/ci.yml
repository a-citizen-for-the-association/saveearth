name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # v1.8.2 is skipped project-wide (RUSTSEC-2026-0285) — see
      # docs/design/003-software-versions.md.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "1.8.3"

      - name: forge fmt --check
        working-directory: contracts
        run: forge fmt --check

      - name: forge lint
        working-directory: contracts
        run: forge lint

      # docs/design/003-software-versions.md 1.1: CI treats compiler
      # warnings as errors, on top of `forge lint`.
      - name: forge build (deny warnings)
        working-directory: contracts
        run: forge build --deny warnings

      - name: forge test
        working-directory: contracts
        run: forge test

      # Definition of Done 2.2 requires 100% line/statement/branch/function
      # coverage on src/ (script/ excluded — see that doc for why). forge
      # coverage has no built-in threshold flag, so the "Total" row is
      # parsed and the job fails if any of the four columns falls short.
      - name: forge coverage (require 100% on src/)
        working-directory: contracts
        run: |
          set -euo pipefail
          OUTPUT=$(forge coverage --no-match-coverage "script/")
          echo "$OUTPUT"
          TOTAL_LINE=$(echo "$OUTPUT" | grep '| Total')
          COUNT=$(echo "$TOTAL_LINE" | grep -o "100.00%" | wc -l)
          if [ "$COUNT" -lt 4 ]; then
            echo "::error::Coverage did not reach 100% on all four metrics (line/statement/branch/function) — see Definition of Done 2.2"
            exit 1
          fi

  frontend-checks:
    name: Frontend (typecheck / lint / format / unit tests / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Format check
        working-directory: frontend
        run: pnpm format:check

      # Definition of Done 2.3: coverage thresholds (80% line/branch/
      # function/statement on lib/+hooks/) are enforced by
      # vitest.config.mts itself — `vitest run --coverage` fails below them.
      - name: Unit tests (Vitest, with coverage)
        working-directory: frontend
        run: pnpm test:coverage

      - name: Build
        working-directory: frontend
        run: pnpm build

  frontend-e2e:
    name: Frontend E2E (Playwright + local Anvil)
    runs-on: ubuntu-latest
    steps:
      # Submodules are needed here too: e2e/global-setup.ts deploys the
      # real contracts (via the actual Deploy.s.sol script) to a local
      # Anvil instance before the Playwright suite runs.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "1.8.3"

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: frontend
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
