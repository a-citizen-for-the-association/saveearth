[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
optimizer = true
optimizer_runs = 200
gas_reports = ["*"]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Deploy.s.sol writes a small deployment record per chain under ./deployments,
# which is committed to git (unlike ./broadcast) so the frontend can read
# real deployed addresses. See script/Deploy.s.sol and README.md.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
# Ethereum: bring your own provider URL (Foundry's public defaults are not
# reliable enough for real deployments).
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
# Polkadot Hub: Foundry ships built-in RPC defaults for these chain names
# (ADR-0003), so these overrides are optional.
polkadot = "${POLKADOT_HUB_RPC_URL}"
polkadot-testnet = "${POLKADOT_HUB_TESTNET_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
quote_style = "double"

[lint]
severity = ["high", "med"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
